<h2 style="margin: 0">GLiNER (urchade/gliner_medium-v2.1)</h2>

<div class="entities" style="line-height: 2.5; direction: ltr">The Epidemic of Lynching in the South Monthly Oration Delivered Before the 
<mark class="entity" style="background: #fbd38d; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Philosophian Literary Society
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">ORGANIZATION</span>
</mark>
 by 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Carroll S. Maree
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
<br><br>Once the name of the South was synonymous with purity and honor, and the highest type of a gentleman was the South- ern cavalier. What were the foremost characteristics of 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Gen. Robert E. Lee
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
? They were his sincere religion and his quiet, gentlemanly manner toward all men. And so it was with 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Jackson
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
, 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Stuart
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 and 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Hampton
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
, and with all the Southern heroes of the Civil War. No Chesterfield or courtier of 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Louis XIV
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 could have excelled the Southern gentleman in politeness or in knightly grace. The murderer, the debauchee, and the libertine were put under the ban by society. The war might sweep away the Southerner’s fortune; the gloomiest adversity might come, but he could not be made any less a gentleman. The South was then the home of the true and the brave.<br><br>But now, what a change! The South, whose hills and valleys and plains are fertilized by the blood of those heroes of in the North as well as in the South, and that negroes have been lynched near the birthplace of 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Lincoln
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
, the emancipator of the slaves. But we all know that the vast majority occur in the South, and that nearly all of those lynched in the South are negroes.the Revolution, who fought for justice and equal rights to all men—that South has had her once fair name befouled and be- smirched. Our Northern brethren now look upon us as law breakers and criminals of the worst description, and think that a man takes his life in his hands when traveling through the South. Is their conception of us a wholly false one? No; a thousand times no! We have given the world a right to think thus and should not be afraid to confess it. The bird of free- dom has been encaged by the Southern lyncher, and there is a stain on the escutcheon of the South. The section which pro- duced 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Calhoun
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 and 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Andrew Jackson
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 is now the object of scorn and ridicule. Since the Civil War the epidemic of lynching has been constantly growing in the South. Beginning with the 
<mark class="entity" style="background: #fbd38d; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Ku-Klux Klan
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">ORGANIZATION</span>
</mark>
 of Reconstruction times and extending down to the present, it has had a career of crime, of shame, and of disgrace.<br><br>But some one will say that lynchings occur Taking the statistics of the cases of mob-murder compiled for the year 1892 we find that 241 persons were executed by lynch- ers in the 
<mark class="entity" style="background: #fbd38d; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    United States
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">ORGANIZATION</span>
</mark>
 during that year, all of these cases ex- cept thirty-eight occurring in the South, and 160 of that num- ber of victims being negroes. I think these statistics are con- vincing.<br><br>Let us stop and consider the magnitude of this crime for a few moments. A mob of crazed men, with usually a skillful and designing leader at their head, take it into their hands to mete out justice to an offender, without having held any form of trial whatever. Where could we find any one with less judgment than an infuriated man? Last April 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    a negro
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 was burned by a mob, and later developments showed that he was entirely guiltless of the charge which had been made against him. Such is very often the case. The very angels cluster- ing around God’s immaculate throne moan to see such a crime as this. And then, for what a small offence is a man thus some- times brutally murdered! There are four cases on record in which the charge was robbery. In 1903 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    a negro
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 was lynched for breaking a white man’s arm. Anglo-Saxon, is this your civilization—your boasted humanity?<br><br>Gentlemen, to strike a little nearer home, even here in 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    South Carolina
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
 we have had the disgraceful affair of 
<mark class="entity" style="background: #fbb6ce; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Lake City
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">CITY OR TOWN</span>
</mark>
, together with many others. 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    South Carolina
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
, the first State to declare in 1861 for States’ rights, must bow her head in shame.<br><br>It is true that several of the States have laws against lynching, but they have proven to be grossly inadequate. It is evident that other measures must be taken. 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Justice Brewer
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
, of the 
<mark class="entity" style="background: #fbd38d; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    United States Supreme Court
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">ORGANIZATION</span>
</mark>
, one of the most learned jurists of our time, has said: “Every man who takes part in the burning or lynching of a negro is a murderer, and should be so considered in the eyes of the law.” It is plain that one of the causes of lynching is the race prejudice. There has grown a feeling here in the South that a negro should be lynched for certain crimes, while a white man, committing the same crime, should not. Many cases of white men commit- ting that terrible crime, too horrible to be mentioned, and not  being lynched attest the truth of this statement. But this con- dition of things should not be. Simply because a man is black is no reason why he should not have some show of justice. Let us adhere rather to the principle of our forefathers, “Equal rights to all—privileges to none.” Every one must see that if this mob violence is allowed to proceed unhindered, certain results will appear in its wake. Human life will depreciate in value. Mob violence is no more than a form of anarchy, and anarchy is but the forerunner of tyranny. Our government will go down in ruin.<br><br>But let us see what is the primary cause of lynching. In the lower strata of society, whence almost invariably comes the rapist, we find an amazing amount of ignorance concerning the heinousness of this crime. No one believes it is wrong; but, on the contrary, they believe it is both morally aud legally right. There are thousands of illiterate negroes and whites in this 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    State
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
 who have no idia what a black crime is this. It is not true, as is often asserted, that the criminal class of negroes is drawn from the educated part of the race; but it is the igno- rant negroes mainly who are criminals. Likewise, those who compose the lynching mobs are generally of the ignorant class of white men. It has been said that education is not a remedy for every evil. This is true; we must concede that education is the fundamental remedy for the evil of the mob violence. There is another cause of lynching. Justice pursuing the breaker of the law with the sword of punishment uplifted, is retarded by the impediments of legal quibbles, delays, techni- calities, red tape and other subterfuges too numerous to men- tion. We must purify the methods in practice in our courts. There was once a time when one could feel assured that the law would give a criminal swift and speedy justice. But such is not now the case. And, rather than undergo the uncertainty of a trial, the friends of the injured one resort to summary methods which are indeed deplorable.<br><br>There is the radical remedy of stern force as a last resort in eradicating mob violence. It has been found effective in 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    Indiana
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
, where the 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    governor
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 promptly called out the 
<mark class="entity" style="background: #fbd38d; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    militia
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">ORGANIZATION</span>
</mark>
 and quelled the lynchers. If the executives of other States would follow his example, instances of mob violence would be reduced to a minimum.<br><br>Gentlemen, it is fitting that we should discuss this momen- tous question. We are the coming men of the 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    South
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
. In five years more we shall all have entered the arena of life. Much will be expected of us. During the generation of our fathers men have gone onward and upward in every sphere of life. The 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    philosopher
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 has rushed into the holiest arcana of philosophy and held up in triumph his speculations and his theories. The 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    inventor
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 has made machines that seem to per- form the work of the human mind. The 
<mark class="entity" style="background: #9ae6b4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    natural scientist
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">PERSON</span>
</mark>
 has wrung from Mother Nature her closely locked and guarded secrets. We are to take up the burden of life and go to higher and better things. And let us rise up in the glorious strength of our young manhood and wipe this stain from the name of the 
<mark class="entity" style="background: #90cdf4; padding: 0.45em 0.6em; margin: 0 0.25em; line-height: 1; border-radius: 0.35em;">
    South
    <span style="font-size: 0.8em; font-weight: bold; line-height: 1; border-radius: 0.35em; vertical-align: middle; margin-left: 0.5rem">STATE</span>
</mark>
. </div>
